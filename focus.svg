    <text x="940" y="342" font-family="-apple-system,'Inter',sans-serif" font-size="19" font-weight="600" fill="#F5F5F7">Performance Tuning</text>
    <text x="940" y="366" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#8E8E93">Faster loads, leaner</text>
    <text x="940" y="384" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#8E8E93">code, smoother UX</text>
