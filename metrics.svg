    <text x="46" y="116" font-family="-apple-system,'Inter',sans-serif" font-size="46" font-weight="600" letter-spacing="-1" fill="#F5F5F7">128,492</text>
    <path d="M46 150 L62 138 L78 146 L94 130" stroke="url(#up)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="172" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#30D5C8">▲ 12.4% this month</text>
