<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0AF0D6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0AF0D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#0AF0D6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- ambient glow blobs -->
  <circle cx="950" cy="60" r="320" fill="url(#glow1)"/>
  <circle cx="200" cy="300" r="280" fill="url(#glow2)"/>

  <!-- fine grid texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- availability pill -->
  <rect x="80" y="56" width="206" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="100" cy="73" r="4" fill="#30D5C8"/>
  <text x="114" y="78" font-family="-apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="13" letter-spacing="0.5" fill="#C7C7CC">Open to new opportunities</text>

  <!-- headline -->
  <text x="80" y="172" font-family="-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="600" letter-spacing="-2" fill="#F5F5F7">
    Muhemmed <tspan fill="url(#textGrad)">Rafi</tspan>
  </text>

  <!-- subhead -->
  <text x="80" y="218" font-family="-apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#8E8E93">
    Full-stack developer designing &amp; shipping products end to end.
  </text>
  <text x="80" y="252" font-family="-apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#8E8E93">
    Web apps · automation · AI-driven workflows — built from Kerala, India.
  </text>

  <!-- bottom hairline -->
  <line x1="80" y1="288" x2="1120" y2="288" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="80" y="310" font-family="-apple-system, 'SF Mono', 'JetBrains Mono', monospace" font-size="13" letter-spacing="0.5" fill="#5E5CE6">vellmont.online</text>
  <text x="1120" y="310" text-anchor="end" font-family="-apple-system, 'SF Mono', 'JetBrains Mono', monospace" font-size="13" letter-spacing="0.5" fill="#5A5A60">est. building since 2021</text>
</svg>
